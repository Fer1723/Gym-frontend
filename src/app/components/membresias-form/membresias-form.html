<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-dark text-white border-secondary py-3 d-flex justify-content-between align-items-center">
          <h4 class="mb-0">
            <i class="bi bi-pencil-fill me-2" style="color: #6f42c1;"></i>
            {{ idMembresiaEdicion ? 'Editar Plan de Membresía' : 'Nuevo Plan de Membresía' }}
          </h4>
          <button class="btn btn-sm btn-outline-light" routerLink="/membresias">
            <i class="bi bi-arrow-left"></i> Volver
          </button>
        </div>
        <div class="card-body bg-dark text-white p-4">
          
          <form [formGroup]="membresiaForm" (ngSubmit)="guardar()">
            
            <div class="mb-3">
              <label class="form-label text-secondary small uppercase fw-bold">Nombre del Plan</label>
              <input type="text" formControlName="nombre" class="form-control bg-dark text-white border-secondary" placeholder="Ej: Mensualidad VIP">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label text-secondary small uppercase fw-bold">Precio ($)</label>
                <input type="number" formControlName="precio" class="form-control bg-dark text-white border-secondary" placeholder="0.00">
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label text-secondary small uppercase fw-bold">Duración (Días)</label>
                <input type="number" formControlName="duracionDias" class="form-control bg-dark text-white border-secondary" placeholder="30">
              </div>
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-gym-yellow py-2" [disabled]="membresiaForm.invalid">
                <i class="bi bi-save-fill me-1"></i> Guardar Plan
              </button>
              <button type="button" class="btn btn-outline-secondary py-2" routerLink="/membresias">
                Cancelar y Volver
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

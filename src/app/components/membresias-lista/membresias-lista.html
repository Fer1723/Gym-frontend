<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-white"><i class="bi bi-tags-fill me-2" style="color: #6f42c1;"></i>Planes y Membresías</h2>
    <button class="btn btn-gym-purple" routerLink="/membresias/nueva">
      <i class="bi bi-plus-circle-fill me-1"></i> Nuevo Plan
    </button>
  </div>

  <div class="card shadow-lg">
    <div class="card-body p-0">
      <table class="table table-dark table-hover align-middle mb-0">
        <thead>
          <tr>
            <th class="ps-3 text-secondary">ID</th>
            <th>Nombre del Plan</th>
            <th>Precio</th>
            <th>Duración</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (plan of membresias; track plan.idMembresia) {
            <tr>
              <td class="ps-3 text-secondary">#{{ plan.idMembresia }}</td>
              <td class="fw-bold">{{ plan.nombre }}</td>
              <td class="text-success fw-bold">${{ plan.precio }}</td>
              <td>{{ plan.duracionDias }} días</td>
              <td class="text-center">
                <div class="d-flex justify-content-center gap-2">
                  
                  <button class="btn btn-sm btn-gym-yellow btn-accion" title="Editar" routerLink="/membresias/editar/{{ plan.idMembresia }}">
                    <i class="bi bi-pencil-square text-dark"></i>
                  </button>
                  
                  <button class="btn btn-sm btn-danger btn-accion" title="Dar de baja" (click)="darDeBaja(plan.idMembresia)">
                    <i class="bi bi-trash3-fill"></i>
                  </button>
                  
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center text-secondary py-5">
                <i class="bi bi-card-heading fs-1 d-block mb-3"></i>
                No hay planes registrados en el sistema.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
